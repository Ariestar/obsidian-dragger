name: Bump md-dragger

on:
  repository_dispatch:
    types: [md-dragger-published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update md-dragger
        run: pnpm update md-dragger

      - name: Open a pull request when the lockfile changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "md-dragger is already current"
            exit 0
          fi
          VERSION="$(node -p "require('./node_modules/md-dragger/package.json').version")"
          BRANCH="chore/md-dragger-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json pnpm-lock.yaml
          git commit -m "chore: bump md-dragger to ${VERSION}"
          git push --force-with-lease -u origin "$BRANCH"
          if gh pr view "$BRANCH" --json url --jq .url >/dev/null 2>&1; then
            echo "pull request already exists"
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "chore: bump md-dragger to ${VERSION}" \
            --body "Opened after md-dragger ${VERSION} was published."

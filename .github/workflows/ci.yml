name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout md-dragger (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: Ariestar/md-dragger
          path: ../md-dragger

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install core package (md-dragger)
        working-directory: ../md-dragger
        run: pnpm install --frozen-lockfile

      - name: Build core package (md-dragger)
        working-directory: ../md-dragger
        run: pnpm run build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint:review

      - name: Format check
        run: pnpm exec biome format --changed --since=origin/main

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Smoke plugin bundle
        run: pnpm run smoke:npm

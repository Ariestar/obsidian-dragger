name: Publish npm

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout md-dragger (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: Ariestar/md-dragger
          path: ../md-dragger

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install core package (md-dragger)
        working-directory: ../md-dragger
        run: pnpm install --frozen-lockfile

      - name: Build core package (md-dragger)
        working-directory: ../md-dragger
        run: pnpm run build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="$GITHUB_REF_NAME"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint:review

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Smoke npm package
        run: pnpm run smoke:npm

      - name: Publish to npm
        run: pnpm publish --registry=https://registry.npmjs.org --access public

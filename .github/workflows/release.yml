name: Release Obsidian Plugin

on:
  push:
    tags:
      - '[0-9]*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout md-dragger (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: Ariestar/md-dragger
          path: ../md-dragger

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: pnpm

      - name: Install core package (md-dragger)
        working-directory: ../md-dragger
        run: pnpm install --frozen-lockfile

      - name: Build core package (md-dragger)
        working-directory: ../md-dragger
        run: pnpm run build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version sync
        run: pnpm run check:versions

      - name: Build
        run: pnpm run build

      - name: Create GitHub Release
        run: |
          NOTES_FILE="docs/release_notes/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" \
              dist/main.js \
              dist/manifest.json \
              dist/styles.css \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/main.js \
              dist/manifest.json \
              dist/styles.css \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
